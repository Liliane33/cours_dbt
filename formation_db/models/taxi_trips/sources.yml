version: 2

sources:
  - name: tlc_taxi_trips
    meta:
      meta:
      external_location: >
        (FROM read_parquet(
          list_transform(
            range(1, 13),
            lambda m: 'https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-' || lpad(m::text, 2, '0') || '.parquet'
          )
        ))
      formatter: oldstyle
    tables:
      - name: raw_yellow_tripdata